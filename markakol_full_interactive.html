<div id="panel" class="panel hide"><strong id="en"></strong><div id="kk" class="translation"></div><div class="row"><button class="action" onclick="saveWord()">★ Save Word</button><button class="action secondary" onclick="document.getElementById('panel').classList.add('hide')">Close</button></div><div id="msg" class="small"></div></div>
<div class="saved"><button class="action secondary" onclick="toggleSaved()">📖 My Vocabulary (<span id="count">0</span>)</button><div id="savedBox" class="hide"><h3>Saved words — Сақталған сөздер</h3><ul id="savedList"></ul><button class="action secondary" onclick="review()">Review cards — Қайталау</button><div id="reviewBox"></div></div></div>
<script>
const KEY='markakol_vocabulary_v1';let current=null;let words=[];
try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))words=v;}catch(e){}
function choose(el){current={en:el.dataset.en.toLowerCase(),kk:el.dataset.kk};document.getElementById('en').textContent=el.dataset.en;document.getElementById('kk').textContent=el.dataset.kk;document.getElementById('msg').textContent='';document.getElementById('panel').classList.remove('hide');}
function saveWord(){if(!current)return;if(!words.some(x=>x.en===current.en)){words.push(current);try{localStorage.setItem(KEY,JSON.stringify(words));document.getElementById('msg').textContent='Saved ✓ — Сақталды';}catch(e){document.getElementById('msg').textContent='Storage is unavailable on this device';}}else{document.getElementById('msg').textContent='Already saved — Бұрын сақталған';}render();}
function toggleSaved(){document.getElementById('savedBox').classList.toggle('hide');render();}
function removeWord(en){words=words.filter(x=>x.en!==en);try{localStorage.setItem(KEY,JSON.stringify(words));}catch(e){}render();}
function render(){document.getElementById('count').textContent=words.length;const ul=document.getElementById('savedList');ul.innerHTML='';words.forEach(w=>{const li=document.createElement('li');li.textContent=w.en+' — '+w.kk+' ';const b=document.createElement('button');b.textContent='Remove';b.className='action secondary';b.style.padding='3px 8px';b.onclick=()=>removeWord(w.en);li.appendChild(b);ul.appendChild(li);});}
function review(){const box=document.getElementById('reviewBox');box.innerHTML='';words.forEach(w=>{const b=document.createElement('button');b.className='action secondary';b.style.margin='4px';b.textContent=w.en+' (tap)';b.onclick=()=>{b.textContent=b.textContent.includes('(tap)')?w.en+' — '+w.kk:w.en+' (tap)';};box.appendChild(b);});if(!words.length)box.textContent='Save words first.';}
render();</script></body></html>
